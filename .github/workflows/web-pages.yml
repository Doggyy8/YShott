name: Publish web version
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yshott-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check planner rules
        run: node --test web/tests/model.test.cjs
      - name: Package browser app
        run: node web/tests/package.cjs
      - name: Configure existing GitHub Pages hosting
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
