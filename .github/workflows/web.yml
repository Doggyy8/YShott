name: Web checks and package
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser source and planner rules
        run: |
          node --check web/model.js
          node --check web/storage.js
          node --check web/app.js
          node --check web/sw.js
          node --test web/tests/model.test.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/yshott-web-test playwright@1.56.1
          /tmp/yshott-web-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test mobile and desktop browser behavior
        env:
          NODE_PATH: /tmp/yshott-web-test/node_modules
        run: node web/tests/browser.cjs
      - name: Package web version
        run: node web/tests/package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: YShott-web
          path: web-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YShott-web-test-results
          path: web-test-results/
          if-no-files-found: ignore
          retention-days: 14
