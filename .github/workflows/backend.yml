name: Backend access checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: yshott_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: yshott_test
    steps:
      - uses: actions/checkout@v4
      - name: Test family isolation and co-parent privacy
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/tests/auth-fixture.sql
          psql -v ON_ERROR_STOP=1 -f backend/schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/auth.sql
          psql -v ON_ERROR_STOP=1 -f backend/tests/access.sql
          psql -v ON_ERROR_STOP=1 -f backend/tests/auth-access.sql
  auth-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3
      - name: Check authentication entry point
        run: |
          deno check backend/functions/yshott-auth/index.ts
          deno test backend/functions/yshott-auth/handler_test.ts
