name: Bouw Android APK
on:
  workflow_dispatch:
  push:
    branches: [plantscan-ai]
  pull_request:
    branches: [plantscan-ai]

concurrency:
  group: plantscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK controleren
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDK_MANAGER"
          echo "SDK_MANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
          "$SDK_MANAGER" --version
      - name: Installeer Android SDK 35
        run: |
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download gecontroleerd Iris 9 model
        run: python3 PlantScanAI/tools/fetch_model.py
      - name: Bouw APK
        run: cd PlantScanAI && gradle --no-daemon :app:assembleDebug
      - name: Controleer dat APK bestaat
        run: |
          test -s PlantScanAI/app/build/outputs/apk/debug/app-debug.apk
          ls -lh PlantScanAI/app/build/outputs/apk/debug/app-debug.apk
      - name: Publiceer APK als artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantScanAI-debug-apk
          path: PlantScanAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publiceer directe APK-download op GitHub
        if: github.ref == 'refs/heads/plantscan-ai' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view plantscan-ai-v0.3.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload plantscan-ai-v0.3.0 \
              "PlantScanAI/app/build/outputs/apk/debug/app-debug.apk#PlantScanAI-v0.3.0.apk" \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create plantscan-ai-v0.3.0 \
              "PlantScanAI/app/build/outputs/apk/debug/app-debug.apk#PlantScanAI-v0.3.0.apk" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "PlantScan AI v0.3.0 — Android testversie" \
              --notes "Fotoherkenning via Iris 9, verplichte online iNaturalist-soortnaamcontrole en videotools. Tweede beeldherkennings-AI is niet geïntegreerd." \
              --prerelease
          fi
